# 🔒 LOCKED — managed by clade · Source: vendor/actions/skip-expiry/action.yml · 改這裡無效，下次 propagate 會覆寫；請改 $CLADE_HOME/vendor/actions/skip-expiry/action.yml
name: 'Skip Expiry Gate'
description: 'Fail a PR that adds a skip without a `clade-skip: until=<YYYY-MM-DD> reason=<text>` marker, touches a test file holding an expired skip, grows .clade/test-trust-baseline.json, or carries a `revive=auto` skip that goes red once its condition is lifted (mutation-probe.ts revive). Judges HEAD against the merge-base via vendor/scripts/checks/skip-gate.ts. Exits 3 when the repo has no baseline (create it with skip-gate.ts --init-baseline). Needs the consumer node_modules (typescript to recognise skips; the test runner for revive) — this action does NOT install anything, place it in an existing test job AFTER the install step; without typescript the gate soft-skips. Assumes the caller has already checked out the repo with fetch-depth: 0 (or enough history to reach the base ref).'
author: 'YuDefine/clade'

inputs:
  base-ref:
    description: 'Ref to compare against (merge-base with HEAD). Defaults to origin/<PR base branch>, then origin/main.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run skip expiry gate
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        PR_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail

        GATE=""
        for candidate in scripts/checks/skip-gate.ts vendor/scripts/checks/skip-gate.ts; do
          if [ -f "$candidate" ]; then GATE="$candidate"; break; fi
        done
        if [ -z "$GATE" ]; then
          echo "::warning::skip-gate.ts not found — consumer not yet propagated, skipping"
          exit 0
        fi

        BASE="${INPUT_BASE_REF:-}"
        if [ -z "$BASE" ]; then
          BASE="origin/${PR_BASE_REF:-main}"
        fi
        if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
          git fetch --no-tags --depth=200 origin "${BASE#origin/}" || true
        fi
        if ! git merge-base HEAD "$BASE" >/dev/null 2>&1; then
          echo "::warning::cannot resolve merge-base(HEAD, $BASE) — checkout needs fetch-depth: 0; skipping"
          exit 0
        fi

        # revive=auto 的復活驗證在 gate 內呼叫 mutation-probe.ts revive（CI 端 --against 才跑）。
        node "$GATE" --against "$BASE"
