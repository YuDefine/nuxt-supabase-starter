# 🔒 LOCKED — managed by clade · Source: vendor/actions/test-removal-receipt/action.yml · 改這裡無效，下次 propagate 會覆寫；請改 $CLADE_HOME/vendor/actions/test-removal-receipt/action.yml
name: 'Test Removal Receipt Gate'
description: 'Fail a PR that deletes or merges test cases without a valid break receipt (or one of the two exemptions: feature-removed, bdd-remove). Judges the diff against the merge-base via vendor/scripts/checks/test-removal-gate.ts: validity 1-5 from the receipts committed in .clade/break-receipts/, then validity 6 by re-running each used receipt with mutation-probe.ts replay (the replay must still be caught). Needs the consumer node_modules (typescript to list test case names; the test runner to replay) — this action does NOT install anything, place it in an existing test job AFTER the install step. Assumes the caller has already checked out the repo with fetch-depth: 0 (or enough history to reach the base ref).'
author: 'YuDefine/clade'

inputs:
  base-ref:
    description: 'Ref to compare against (merge-base with HEAD). Defaults to origin/<PR base branch>, then origin/main.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run test-removal receipt gate
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        PR_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail

        GATE=""
        for candidate in scripts/checks/test-removal-gate.ts vendor/scripts/checks/test-removal-gate.ts; do
          if [ -f "$candidate" ]; then GATE="$candidate"; break; fi
        done
        if [ -z "$GATE" ]; then
          echo "::warning::test-removal-gate.ts not found — consumer not yet propagated, skipping"
          exit 0
        fi

        BASE="${INPUT_BASE_REF:-}"
        if [ -z "$BASE" ]; then
          BASE="origin/${PR_BASE_REF:-main}"
        fi
        if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
          git fetch --no-tags --depth=200 origin "${BASE#origin/}" || true
        fi
        if ! git merge-base HEAD "$BASE" >/dev/null 2>&1; then
          echo "::warning::cannot resolve merge-base(HEAD, $BASE) — checkout needs fetch-depth: 0; skipping"
          exit 0
        fi

        # Validity 6 (re-run each receipt) is done by the gate itself: it calls the sibling
        # mutation-probe.ts (scripts/ or vendor/scripts/) `replay <receipt> --json`.
        node "$GATE" --against "$BASE"
