catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.21
  vite-plus: 0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.21
packages:
  - 'packages/*'
  - 'vendor/specformula-ts/packages/*'

# Agent / CI 沒有 TTY 時，pnpm 11 遇到要清 node_modules 會 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY 讓 husky 死掉。
confirmModulesPurge: false

# pnpm v11 移除 ignoredBuiltDependencies；未表態的 build script 會讓 install 退出碼 1。
# SoT 形狀見 packages/create-nuxt-starter/templates/base/pnpm-workspace.yaml。
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  maplibre-gl: true
  prisma: true
  sharp: true
  vue-demi: true
  workerd: true

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-doctor@0.0.10

# @specformula/node 的 index 靜態 import SqliteDataSource → better-sqlite3，但上游
# package.json 沒宣告。歸屬到 @specformula/node 而非 consumer devDependencies
# （clade specformula cookbook § 已知地雷；上游若改 lazy import 可移除本段）。
packageExtensions:
  '@specformula/node':
    dependencies:
      better-sqlite3: ^12.9.0
