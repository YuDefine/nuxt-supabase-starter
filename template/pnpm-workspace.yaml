catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  '@vitest/coverage-v8': 5.0.1
packages:
  - 'packages/*'
  - 'vendor/specformula-ts/packages/*'

# Agent / CI 沒有 TTY 時，pnpm 11 遇到要清 node_modules 會 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY 讓 husky 死掉。
confirmModulesPurge: false

# pnpm v11 移除 ignoredBuiltDependencies；未表態的 build script 會讓 install 退出碼 1。
# SoT 形狀見 packages/create-nuxt-starter/templates/base/pnpm-workspace.yaml。
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  maplibre-gl: true
  prisma: true
  sharp: true
  vue-demi: true
  workerd: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  # vitest-environment-nuxt@2.0.0 的 `@nuxt/test-utils: ^4.0.0` dep 若放行會解析出
  # 4.0.x，它的 vitest-environment.mjs 仍靜態 import vitest 5 已移除的
  # `vitest/environments` 子路徑（forks worker 啟動時炸 resolve）。釘到 4.3.3+
  # 讓 env 套件與直接 devDep 共用同一份 4.3.3，順便消滅 test-utils@4.0.0 ↔
  # vitest-environment-nuxt@1.0.1 的循環殘留。
  '@nuxt/test-utils@*': '^4.3.3'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-doctor@0.0.10

# @specformula/node 的 index 靜態 import SqliteDataSource → better-sqlite3，但上游
# package.json 沒宣告。歸屬到 @specformula/node 而非 consumer devDependencies
# （clade specformula cookbook § 已知地雷；上游若改 lazy import 可移除本段）。
packageExtensions:
  '@specformula/node':
    dependencies:
      better-sqlite3: ^12.9.0
