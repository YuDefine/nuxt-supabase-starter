# pnpm v11+ 的 build script approval dict。**這裡是唯一有效的位置** ——
# package.json 的 `pnpm` 欄位自 pnpm v11 起不再被讀取（只會 emit 一行 WARN）。
#
# 少一個 key 的代價不是「那個套件不編譯」而是 `pnpm install` **退出碼 1**：
# pnpm 會把未表態的套件寫成 `set this to true or false` 佔位字串並 abort。
# 而 husky pre-commit 觸發 deps status check 時會再跑一次 install，於是
# 連 commit 都跟著失敗 —— 一個 key 缺席會同時打掉安裝、投影、提交三件事。
#
# 這些都是知名 OSS（native binding 或 wasm 編譯）。若要收緊，把對應 key 改 false。
allowBuilds:
  '@parcel/watcher': true
  # nitropack → db0 傳遞依賴，任何 Nuxt 專案都會有，與選了什麼 feature 無關。
  better-sqlite3: true
  esbuild: true
  maplibre-gl: true
  # 監控 feature 帶進來。列著不會有副作用（沒裝就沒有這個 key 的對象）。
  '@sentry/cli': true
  sharp: true
  vue-demi: true
  workerd: true
