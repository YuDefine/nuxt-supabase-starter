name: scaffold-smoke

on:
  pull_request:
    paths:
      - scripts/smoke-scaffold.sh
      - docs/QUICK_START.md
      - docs/CLAUDE_CODE_GUIDE.md
      - docs/CLI_SCAFFOLD.md
      - template/packages/create-nuxt-starter/**
      - template/scripts/templates/github/.github/workflows/**
      - template/.node-version
  push:
    branches:
      - main
    paths:
      - scripts/smoke-scaffold.sh
      - template/packages/create-nuxt-starter/**
      - template/scripts/templates/github/.github/workflows/**
      - package.json
      - docs/QUICK_START.md
      - docs/CLAUDE_CODE_GUIDE.md
      - docs/CLI_SCAFFOLD.md
      - .github/workflows/scaffold-smoke.yml
      - template/.node-version
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.node-version
      - name: Verify node -v matches template/.node-version
        run: test "$(node -v)" = "v$(cat "$GITHUB_WORKSPACE/template/.node-version")"

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Run scaffold smoke test
        run: bash scripts/smoke-scaffold.sh temp/ci-scaffold-smoke
