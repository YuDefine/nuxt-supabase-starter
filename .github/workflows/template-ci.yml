name: Template CI

on:
  pull_request:
    paths:
      - 'template/app/**'
      - 'template/server/**'
      - 'template/shared/**'
      - 'template/layers/**'
      - 'template/supabase/**'
      - 'template/scripts/**'
      - 'template/e2e/**'
      - 'template/nuxt.config.ts'
      - 'template/package.json'
      - 'template/evlog.map.json'
      - 'template/pnpm-lock.yaml'
      - 'template/tsconfig*.json'
      - 'template/.claude/hub.json'
      - '.github/workflows/template-ci.yml'
  push:
    branches: [main]
    paths:
      - 'template/app/**'
      - 'template/server/**'
      - 'template/shared/**'
      - 'template/layers/**'
      - 'template/supabase/**'
      - 'template/scripts/**'
      - 'template/e2e/**'
      - 'template/nuxt.config.ts'
      - 'template/package.json'
      - 'template/evlog.map.json'
      - 'template/pnpm-lock.yaml'
      - 'template/tsconfig*.json'
      - 'template/.claude/hub.json'
      - '.github/workflows/template-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Lint / Typecheck / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: template
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # evlog map gate 要跟 base ref 比對，才判斷得出「本次 diff 觸及哪些
          # entry point」。shallow clone 會讓那條判定退化成 warning。
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Setup Vite+ (vp)
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Format check
        run: vp fmt --check

      - name: Lint
        run: vp lint

      - name: Typecheck
        run: vp run typecheck

      - name: Unit tests
        run: vp test --coverage

      - name: UX drift audit
        run: vp run audit:ux-drift

      # app 根是 template/，所以 cwd 指過去；baseline 在 template/evlog.map.json。
      # composite action 的步驟不吃 job 的 defaults.working-directory，它跑在
      # workspace 根，因此這裡不需要（也不能）依賴上面的 working-directory。
      - name: evlog map coverage gate
        uses: ./template/.github/actions/evlog-map-gate
        with:
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          cwd: template

      # NOTE: Spectra roadmap drift check 在 CI 環境經常 false positive
      # （spectra CLI 不在 ubuntu PATH、.spectra/spectra.db 不存在等），
      # 暫時不在 CI 擋；本地 hook 仍會跑 sync 維持 ROADMAP 鮮度。
      # Follow-up: 讓 sync --check 在 spectra CLI unavailable 時對齊 disk
      # parked block（已有 skip-replace 機制，但其他結構性差異待查），
      # 之後再恢復這個 gate。
