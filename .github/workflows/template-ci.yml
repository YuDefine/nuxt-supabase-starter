name: Template CI

on:
  pull_request:
    paths:
      - 'template/app/**'
      - 'template/server/**'
      - 'template/shared/**'
      - 'template/layers/**'
      - 'template/supabase/**'
      - 'template/scripts/**'
      - 'template/e2e/**'
      - 'template/nuxt.config.ts'
      - 'template/package.json'
      - 'template/evlog.map.json'
      - 'template/pnpm-lock.yaml'
      - 'template/tsconfig*.json'
      - 'template/.claude/hub.json'
      - '.github/workflows/template-ci.yml'
  push:
    branches: [main]
    paths:
      - 'template/app/**'
      - 'template/server/**'
      - 'template/shared/**'
      - 'template/layers/**'
      - 'template/supabase/**'
      - 'template/scripts/**'
      - 'template/e2e/**'
      - 'template/nuxt.config.ts'
      - 'template/package.json'
      - 'template/evlog.map.json'
      - 'template/pnpm-lock.yaml'
      - 'template/tsconfig*.json'
      - 'template/.claude/hub.json'
      - '.github/workflows/template-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Lint / Typecheck / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: template
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # evlog map gate 要跟 base ref 比對，才判斷得出「本次 diff 觸及哪些
          # entry point」。shallow clone 會讓那條判定退化成 warning。
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Setup Vite+ (vp)
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Format check
        run: vp fmt --check

      - name: Lint
        run: vp lint

      - name: Typecheck
        run: vp run typecheck

      - name: Unit tests
        run: vp test --coverage

      - name: UX drift audit
        run: vp run audit:ux-drift

      # app 根是 template/，所以 cwd 指過去；baseline 在 template/evlog.map.json。
      # composite action 的步驟不吃 job 的 defaults.working-directory，它跑在
      # workspace 根，因此這裡不需要（也不能）依賴上面的 working-directory。
      - name: evlog map coverage gate
        uses: ./template/.github/actions/evlog-map-gate
        with:
          base-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          cwd: template

      # TD-004 診斷步驟（不擋 CI）。
      #
      # 這個 gate 因 CI false positive 被停用，但 2026-08-19 在本機把三個已知
      # 差異全模擬過——fresh shallow clone、node 24、spectra CLI 不在 PATH——
      # `--check` 一律 PASS，本機重現不出來。剩下的差異只在 ubuntu runner 上
      # 才顯現，所以先用 continue-on-error 把 CI 側的實際輸出撈回來定位。
      #
      # 判讀：連續數輪都是 `check passed` → 問題已隨其他改動消失，把
      # continue-on-error 拿掉改回真 gate，並結案 docs/tech-debt.md TD-004。
      # 若報 stale → 底下的 diff 就是 TD-004 §Fix approach 第 1 步要的
      # structural difference 來源。
      - name: Spectra roadmap drift check (diagnostic, non-blocking)
        continue-on-error: true
        run: |
          cp openspec/ROADMAP.md /tmp/roadmap-before.md
          if vp run spectra:roadmap --check; then
            echo "::notice::roadmap drift check PASSED in CI"
          else
            echo "::warning::roadmap drift check reported stale — dumping diff"
            vp run spectra:roadmap
            echo '--- diff: committed (left) vs CI-synced (right) ---'
            diff -u /tmp/roadmap-before.md openspec/ROADMAP.md || true
            git checkout -- openspec/ROADMAP.md
          fi
