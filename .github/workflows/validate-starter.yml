name: Validate Starter

on:
  pull_request:
    paths:
      - "template/packages/create-nuxt-starter/**"
      - "template/presets/**"
      - "scripts/validate-starter-scaffold.mjs"
      - "template/package.json"
      - "template/pnpm-lock.yaml"
      - ".github/workflows/validate-starter.yml"
      - "template/.node-version"
  push:
    branches: [main]
    paths:
      - "template/packages/create-nuxt-starter/**"
      - "template/presets/**"
      - "scripts/validate-starter-scaffold.mjs"
      - "template/package.json"
      - "template/pnpm-lock.yaml"
      - ".github/workflows/validate-starter.yml"
      - "template/.node-version"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-starter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fresh Scaffold Audit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: template
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Setup Vite+ (vp)
        # composite action 不吃 job 的 defaults.working-directory，它跑在 workspace 根，
        # 而這個 meta monorepo 的根沒有 package.json。setup-vp 的 run-install 預設是
        # true，於是它會在根跑 `vp install` 並以 ENOENT / code 254 掛掉（浮動 v1 tag
        # 在 2026-09-08 前後移動後開始發生）。working-directory 同時修好 lockfile 與
        # cache key 的自動偵測；install 維持由下面那個顯式步驟負責，只留一個安裝點。
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          working-directory: template
          run-install: false
      - name: Verify node -v matches template/.node-version
        run: |
          raw="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/template/.node-version")"; want="v${raw#v}"
          got="$(node -v)"
          echo "node -v=$got, template/.node-version=$want"
          test "$got" = "$want"
      - name: Install dependencies
        run: vp install

      - name: Validate starter scaffolds
        run: node ../scripts/validate-starter-scaffold.mjs
